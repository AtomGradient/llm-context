[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-context-cli"
version = "0.0.4"
description = "A tool to combine multiple files into a single file for AI context"
readme = "README.md"
authors = [{ name = "atomgradient", email = "alex@atomgradient.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["llm", "context", "file", "combine"]
dependencies = [
    "click>=8.0.0",
    "rich>=10.0.0",
]
requires-python = ">=3.7"

[project.urls]
Homepage = "https://github.com/AtomGradient/llm-context"

[project.scripts]
llm-context-cli = "ai_context.cli:main"